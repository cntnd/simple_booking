<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Sauna Schüpfenried</title>
	<style type="text/css">
		body {
			background-color: #CCDDFF;
			color: rgb(72,101,152);
			font-family: Arial, Helvetica, sans-serif;
			margin-top: 40px;
		}

		body > div {
			width: 640px;
			margin: 0 auto;
		}

		h1,h2,h3,p, i {
			margin: 0 0 1rem 0;
		}
	</style>
</head>
<body>

<div>
	<img src="https://www.schuepfenried.ch/hof/upload/bilder/reservation.jpg" width="640" alt="Gutschein">

	<h2>Folgende Reservation wurde aus dem Kalender entfernt:</h2>
	<p>Nachricht: {$message}</p>
	<hr />

	<table width="100%">
		<tr>
			<td style="width: 33%; padding: 10px 0;">Sauna:</td>
			<td><strong>{$sauna}</strong></td>
		</tr>
		<tr>
			<td style="width: 33%; padding: 10px 0;">Datum:</td>
			<td><strong>{$date}</strong></td>
		</tr>
		<tr>
			<td style="width: 33%; padding: 10px 0;">Zeit:</td>
			<td><strong>{$time}</strong></td>
		</tr>
		<tr>
			<td style="width: 33%; padding: 10px 0;">Anzahl Personen:</td>
			<td><strong>{$personen}</strong></td>
		</tr>
		<tr>
			<td style="width: 33%; padding: 10px 0;">Ihre Bemerkungen:</td>
			<td>{$bemerkungen}</td>
		</tr>
	</table>
</div>
</body>
</html>
