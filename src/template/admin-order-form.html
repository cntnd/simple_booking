<div class="form-group">
  <label for="cntnd_booking-admin-order[forename]">Vorname<em>*</em></label>
  <input type="text" name="cntnd_booking-admin-order[forename]" id="cntnd_booking-admin-order[forename]" value="" class="form-control required"/>
</div>
<div class="form-group">
  <label for="cntnd_booking-admin-order[surname]">Nachname<em>*</em></label>
  <input type="text" name="cntnd_booking-admin-order[surname]" id="cntnd_booking-admin-order[surname]" value="" class="form-control required"/>
</div>
<div class="form-group">
  <label for="cntnd_booking-admin-order[street]">Adresse</label>
  <input type="text" name="cntnd_booking-admin-order[street]" id="cntnd_booking-admin-order[street]" value="" class="form-control"/>
</div>
<div class="d-flex">
  <div class="w-33 form-group">
    <label for="cntnd_booking-admin-order[postcode]">PLZ</label>
    <input type="text" name="cntnd_booking-admin-order[postcode]" id="cntnd_booking-admin-order[postcode]" value="" class="form-control"/>
  </div>
  <div class="w-66 form-group">
    <label for="cntnd_booking-admin-order[place]">Ort</label>
    <input type="text" name="cntnd_booking-admin-order[place]" id="cntnd_booking-admin-order[place]" value="" class="form-control"/>
  </div>
</div>
<div class="form-group">
  <label for="cntnd_booking-admin-order[email]">E-Mail<em>*</em></label>
  <input type="email" name="cntnd_booking-admin-order[email]" id="cntnd_booking-admin-order[email]" value="" class="required email form-control"/>
</div>
<div class="form-group">
  <label for="cntnd_booking-admin-order[phone]">Telefon<em>*</em></label>
  <input type="text" name="cntnd_booking-admin-order[phone]" id="cntnd_booking-admin-order[phone]" value="" class="required form-control"/>
</div>
<div class="form-group">
  <label for="cntnd_booking-admin-order[persons]">Anzahl Personen<em>*</em></label>
  <select name="cntnd_booking-admin-order[persons]" id="cntnd_booking-admin-order[persons]" class="required form-control">
    <option>- bitte Auswählen -</option>
    <option value="1">1 Person</option>
    <option value="2">2 Personen</option>
    <option value="3">3 Personen</option>
    <option value="4">4 Personen</option>
    <option value="5">5 Personen</option>
    <option value="6">6 Personen</option>
  </select>
</div>
<div class="form-group">
  <label for="cntnd_booking-admin-order[comment]">Bemerkungen</label>
  <textarea name="cntnd_booking-admin-order[comment]" id="cntnd_booking-admin-order[comment]" class="form-control" rows="3"></textarea>
</div>
